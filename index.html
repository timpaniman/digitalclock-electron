<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Digital Clock (Electron)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0e12;
        color: #7effb0;
        overflow: hidden;
        user-select: none;
      }

      .clock {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #time {
        font-family: Consolas, "Courier New", monospace;
        font-size: 54px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      #date {
        margin-top: 12px;
        font-family: "Segoe UI", sans-serif;
        font-size: 18px;
        color: #b0c4ba;
      }
    </style>
  </head>
  <body>
    <div class="clock">
      <div id="time"></div>
      <div id="date"></div>
    </div>
    <script>
      const timeEl = document.getElementById("time");
      const dateEl = document.getElementById("date");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function refreshClock() {
        const now = new Date();
        timeEl.textContent = [
          pad(now.getHours()),
          pad(now.getMinutes()),
          pad(now.getSeconds())
        ].join(":");
        dateEl.textContent = now.toLocaleDateString("en-US", {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });
      }

      refreshClock();
      setInterval(refreshClock, 200);
    </script>
  </body>
</html>
